[package]
name = "bettor-cli"
description = "JSON stdin/stdout front end for bettor-core. The Streamlit app runs the WebAssembly build."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["parallel"]
parallel = ["bettor-core/parallel"]

[dependencies]
bettor-core = { path = "../bettor-core", default-features = false }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "bettor-cli"
path = "src/main.rs"
