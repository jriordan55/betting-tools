[package]
name = "bettor-desktop"
description = "Sports betting calculators and simulations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bettor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# This crate is a shell. It owns windowing, IPC, and the SQLite bet log.
# It owns no math — that all lives in `bettor-core`.
[dependencies]
bettor-core = { path = "../crates/bettor-core", features = ["specta"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled so the app never depends on a system SQLite, which on macOS is an
# old build with different defaults than the one this schema was tested on.
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.22"
specta-typescript = "=0.0.9"

[lints]
workspace = true

[dev-dependencies]
csv = "1"

[[example]]
name = "import_bets"
path = "examples/import_bets.rs"

[[example]]
name = "import_transactions"
path = "examples/import_transactions.rs"
