  <title>Bettor Desktop</title>
  <desc>A normal distribution graded against a line: the shape every model in
  the app reduces to, and the reason a price is not the same thing as an edge.
  The shaded tail is the side that covers.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191922"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="0.55" stop-color="#12cfa0"/>
      <stop offset="1" stop-color="#2ed573"/>
    </linearGradient>
    <clipPath id="plot">
      <rect x="132" y="90" width="760" height="672"/>
    </clipPath>
  </defs>

  <!-- Tile. Radius is macOS-ish rather than exact; Tauri applies no mask. -->
  <rect x="0" y="0" width="1024" height="1024" rx="216" fill="url(#tile)"/>
  <rect x="9" y="9" width="1006" height="1006" rx="210" fill="none"
        stroke="#31313f" stroke-width="12"/>

