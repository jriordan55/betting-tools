<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bettor Desktop</title>
	<meta name="description" content="Download Bettor Desktop — the Rust betting app with your book already loaded.">
	<link rel="canonical" href="https://jriordan55.github.io/betting-tools/">
	<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
	<style>
		:root {
			--bg: #0f1117;
			--panel: #161922;
			--border: #2c3344;
			--text: #e8eaf0;
			--muted: #9aa3b5;
			--accent: #2dd4bf;
			--sans: "Segoe UI", system-ui, sans-serif;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 2rem 1.25rem;
			font-family: var(--sans);
			background:
				radial-gradient(circle at top, #1a2338 0%, transparent 45%),
				var(--bg);
			color: var(--text);
		}
		main {
			width: min(34rem, 100%);
			padding: 2rem 1.75rem;
			border: 1px solid var(--border);
			border-radius: 14px;
			background: color-mix(in srgb, var(--panel) 92%, transparent);
		}
		h1 {
			margin: 0;
			font-size: 1.85rem;
			letter-spacing: -0.03em;
		}
		p {
			margin: 0.85rem 0 0;
			color: var(--muted);
			line-height: 1.55;
		}
		.actions {
			display: grid;
			gap: 0.75rem;
			margin-top: 1.6rem;
		}
		a.button {
			display: block;
			text-align: center;
			text-decoration: none;
			padding: 0.95rem 1rem;
			border-radius: 10px;
			font-weight: 650;
			border: 1px solid transparent;
		}
		a.primary {
			background: var(--accent);
			color: #042f2e;
		}
		a.secondary {
			background: transparent;
			color: var(--text);
			border-color: var(--border);
		}
		.status {
			margin-top: 1rem;
			font-size: 0.85rem;
			color: var(--muted);
		}
		code {
			font-size: 0.9em;
			color: var(--accent);
		}
	</style>
</head>
<body>
	<main>
		<h1>Bettor Desktop</h1>
		<p>
			The original Rust app. Your Pikkit book is already inside — open it,
			add bets one at a time, and they stay on that machine.
		</p>
		<div class="actions">
			<a class="button primary" id="download" href="https://github.com/jriordan55/betting-tools/releases/latest">
				Download for Windows
			</a>
			<a class="button secondary" href="https://github.com/jriordan55/betting-tools">
				Source on GitHub
			</a>
		</div>
		<p class="status" id="status">Looking up the latest installer…</p>
	</main>
	<script>
		const status = document.getElementById("status");
		const download = document.getElementById("download");
		const api = "https://api.github.com/repos/jriordan55/betting-tools/releases/latest";

		fetch(api)
			.then((response) => {
				if (!response.ok) throw new Error("no release yet");
				return response.json();
			})
			.then((release) => {
				const assets = release.assets || [];
				const setup =
					assets.find((asset) => /setup\.exe$/i.test(asset.name)) ||
					assets.find((asset) => /\.msi$/i.test(asset.name)) ||
					assets[0];
				if (setup) {
					download.href = setup.browser_download_url;
					download.textContent = "Download " + setup.name;
					status.textContent = "Latest release: " + release.tag_name;
				} else {
					download.href = release.html_url;
					status.textContent = "Open the release page to pick an installer.";
				}
			})
			.catch(() => {
				status.innerHTML =
					'Build still publishing — use <a href="https://github.com/jriordan55/betting-tools/releases">Releases</a> in a minute.';
			});
	</script>
</body>
</html>
