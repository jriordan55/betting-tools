[package]
name = "bettor-desktop"
description = "Sports betting calculators and simulations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bettor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# This crate is a shell. It owns windowing, IPC, and (later) the SQLite bet log.
# It owns no math — that all lives in `bettor-core`.
[dependencies]
bettor-core = { path = "../crates/bettor-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
